# `mpos-boot` loads the kernel as a position-independent executable: it places
# the segments wherever the firmware gave it memory, maps them at the kernel's
# linked higher-half address, and applies the RELATIVE relocations itself. These
# flags are what make that possible - `pic` and `-pie` for the relocations,
# `-ztext` to refuse any of them landing in a read-only segment.
#
# The loader is not built from this configuration: `boot/.cargo/config.toml`
# overrides the target for it, because it is a UEFI application and this is the
# kernel.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# The target spec already sets `-mmx,-sse,...,-avx2,+soft-float` and
# `disable-redzone`, so nothing here has to repeat it. That is what lets the
# context switch save only the callee-saved general registers: there is no
# vector state in use anywhere in the kernel, and no red zone for an interrupt
# to land on. Adding `+soft-float` here would be rejected anyway - rustc does
# not accept it through -Ctarget-feature.
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=--script=src/arch/x86_64/linker.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-ztext",
    "-C", "link-arg=-zmax-page-size=0x1000",
]

# There is no `[target.aarch64-unknown-none]` here, and there used to be: it
# named `src/arch/aarch64/linker.ld`, which has never existed, so the profile
# described a target that could not link. The port's real prerequisites are
# `PLAN.md` §9.1; until they are written the configuration does not claim a
# backend it cannot build. Re-adding the block is one line, next to a script
# that is actually there.

# The user programs: ordinary Rust binaries for musl, which is the libc this
# kernel's Linux ABI is written against. They are **statically** linked and
# non-PIE because the loader has no PT_INTERP support and only accepts the
# ET_EXEC shape - a dynamically linked or position-independent program is
# refused before its first instruction, which is why the whole userland used
# to be built by hand with rustc and these same flags.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-Wl,-z,norelro",
]

[alias]
xtask = "run --quiet --package mpos-xtask --target x86_64-unknown-linux-gnu --"
