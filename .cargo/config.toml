# `mpos-boot` loads the kernel as a position-independent executable: it places
# the segments wherever the firmware gave it memory, maps them at the kernel's
# linked higher-half address, and applies the RELATIVE relocations itself. These
# flags are what make that possible - `pic` and `-pie` for the relocations,
# `-ztext` to refuse any of them landing in a read-only segment.
#
# The loader is not built from this configuration: `boot/.cargo/config.toml`
# overrides the target for it, because it is a UEFI application and this is the
# kernel.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# The target spec already sets `-mmx,-sse,...,-avx2,+soft-float` and
# `disable-redzone`, so nothing here has to repeat it. That is what lets the
# context switch save only the callee-saved general registers: there is no
# vector state in use anywhere in the kernel, and no red zone for an interrupt
# to land on. Adding `+soft-float` here would be rejected anyway - rustc does
# not accept it through -Ctarget-feature.
#
# The `mpos_*` flags are the capabilities this machine declares to `crate::hal`
# (`src/hal/mod.rs`): the local APIC's message-signalled delivery, the 16550's
# interrupting transmit ring, the x87 lazy-FPU trap, the `rt_sigframe` a handler
# runs on, a framebuffer console to paint the virtual-console grids on, a
# per-BAR dynamic MMIO window for device registers, and a compiled network
# stack.
# `hal` forwards each under `#[cfg(mpos_…)]` and names no architecture; the
# machine-to-capability mapping lives here, beside the linker-script path that
# is this file's other per-machine fact. A port declares its own set in its own
# `[target.…]` block, which it already needs for its script.
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=--script=src/arch/x86_64/linker.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-ztext",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "--cfg", "mpos_msi",
    "--cfg", "mpos_serial_ring",
    "--cfg", "mpos_fpu_trap",
    "--cfg", "mpos_signal_frame",
    "--cfg", "mpos_framebuffer_console",
    "--cfg", "mpos_dynamic_mmio_window",
    "--cfg", "mpos_net",
    # Two more of the same kind, declared here because the machine is where the
    # difference lives. `mpos_pci_config` is "this machine has a PCI bus whose
    # configuration space can be read and written" - the `/proc/bus/pci` and
    # `/sys/bus/pci` config nodes' read/write halves, which go through port I/O
    # here and have no aarch64 counterpart (a `virt` machine has no PCI on the
    # MMIO path this port drives). The *tree* is built from the machine-neutral
    # `crate::pci` model on both machines; on a machine without the capability
    # the enumeration is empty, so no such node is built and the absent method is
    # unreachable rather than faked. `mpos_input_registry` is "this machine
    # publishes an evdev registry that `/sys/class/input` can enumerate" - this
    # machine's virtio-PCI input driver's, whose nodes `udev` and `libinput` read
    # to classify a keyboard. aarch64 opens a virtio-input over MMIO but keeps no
    # such registry, so its class directory is honestly empty.
    "--cfg", "mpos_pci_config",
    "--cfg", "mpos_input_registry",
]

# The aarch64 kernel, built the way the x86_64 one is and for the same reason:
# `mpos-boot` reads it as a static PIE, so `pic` and `-pie` for the relocations
# and `-ztext` to refuse any of them landing in a read-only segment. The two
# machine blocks differ in the script and the capability flags they name, and
# in nothing else.
#
# There used to be a `[target.aarch64-unknown-none]` block here naming a script
# that had never existed, so it described a target that could not link and was
# removed (PLAN.md §9.1, V-8). It came back at stage 1a with the script, and at
# stage 1e it stopped being `relocation-model=static`: that model belonged to
# the `-kernel` bring-up, which linked the image at the fixed address QEMU
# loaded it at. The loader places the segments itself now, so the image has to
# be relocatable and this block matches the x86_64 one.
#
# Its PL011's receiver is polled for the bring-up self-test (`hal::ConsoleInput`,
# absent on x86_64, whose receiver interrupts into the console mux instead) *and*
# its transmitter interrupts through the GIC's INTID 33 once the wiring arms it,
# so this machine is a `SerialRing` as well - which is exactly the arrangement
# the capability exists to describe: the polled write stayed, `crate::console`
# learned nothing about either machine, and the second machine's difference is a
# word in this file. It has a compiled network stack (`mpos_net`, the same one the first
# machine declares): the seam landed with §13.4's device stage, so the socket
# syscalls route into `net` here too, and its adapter is the MMIO window
# `check_net` opens and `main` hands to `net::init`. And its own `rt_sigframe`
# (`sigcontext`, the `fpsimd_context` record, `rt_sigreturn`) since §13.2's Stage
# 3b, so `mpos_signal_frame` is declared here too. It has no MSI controller and
# no lazy FPU trap, so it declares none of the other x86_64 flags.
[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=--script=src/arch/aarch64/linker.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-ztext",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "--cfg", "mpos_console_input",
    "--cfg", "mpos_serial_ring",
    "--cfg", "mpos_net",
    "--cfg", "mpos_signal_frame",
]

# The user programs: ordinary Rust binaries for musl, which is the libc this
# kernel's Linux ABI is written against. They are **statically** linked and
# non-PIE because the loader has no PT_INTERP support and only accepts the
# ET_EXEC shape - a dynamically linked or position-independent program is
# refused before its first instruction, which is why the whole userland used
# to be built by hand with rustc and these same flags.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-Wl,-z,norelro",
]

# The second machine's user programs, reached by cargo rather than by the
# hand-driven `rustc` that builds `boot-aarch64`'s `/musl` helper - same static
# ET_EXEC shape, and one flag the x86_64 block does not need: the linker.
#
# Rustc passes `--fix-cortex-a53-843419` for this target - the erratum workaround
# every aarch64 link gets - and the host's `ld` is not an aarch64 linker and
# rejects the option outright (`unrecognized option '--fix-cortex-a53-843419'`,
# measured: a cargo build of any aarch64 musl crate dies at the link step). The
# helper build names `rust-lld` itself
# (`aarch64_init::build_static_musl_helper`), which is why it links where cargo
# did not; naming it here is the same decision made once for the target instead
# of once per program.
#
# `relocation-model=static`/`-no-pie` are left to the target default, which the
# helper already relies on: `aarch64-unknown-linux-musl` is non-PIE, and the
# loader accepts only the ET_EXEC shape.
[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "linker=rust-lld",
]

[alias]
xtask = "run --quiet --package mpos-xtask --target x86_64-unknown-linux-gnu --"
