# doas(1) - the privilege escalation tool this image ships instead of sudo.
#
# Members of `wheel` may run anything as root without a password. The console
# is a serial line with no keyboard to type a password on, and the account the
# config creates is passwordless for the same reason; a `doas` that asked for a
# password nobody can type would be an escalation tool nobody can use.
#
# `-w` (`-n` on some builds) is what a script wants when it must not prompt;
# `doas -s` is a root shell.
#
# The syntax, for the record: `permit|deny [options] identity [as target]
# [cmd [args]]`. `^` and `$` anchor command paths. This file is read by doas(1)
# itself, and a syntax error here stops every `doas` call, so keep it simple.

permit nopass :wheel as root
