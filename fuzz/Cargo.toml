[package]
name = "mpos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Its own workspace root. The kernel's workspace at `..` lists its members
# explicitly and does not include this crate, so without this table cargo
# refuses to build: `mpos-fuzz` would believe it belongs to a workspace that
# never heard of it. Keeping it separate is also what lets the fuzz build pick
# `--target x86_64-unknown-linux-gnu` over the kernel's own `[build] target`,
# which is `x86_64-unknown-none` and cannot link a libFuzzer binary.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The structured inputs: `pci_bars`, `sched_policy`, `date_civil`, `keymap_events`,
# `signal_sets`, `term_grid` take a derived shape rather than a byte string,
# because the thing worth fuzzing in those is the field values, not their
# encoding. Raw bytes stay the input for the parsers that read a format.
arbitrary = { version = "1", features = ["derive"] }

# The ACPI table reader, as its own leaf: the kernel reaches it through this
# dependency rather than through `mpos`, because the crate is host-buildable on
# its own and the target below is a test of the *parser*, not of the kernel.
[dependencies.mpos-acpi]
path = "../crates/acpi"

# The kernel library, built for the host. Everything reachable here is what
# `src/lib.rs` leaves un-gated for a `target_os = "none"`-free build: the
# parsers that decide what the kernel trusts from bytes - ELF, ustar, the
# on-disk ext2/ext4 structures, partition tables, paths, PCI sizing, the
# console's escape parser.
[dependencies.mpos]
path = ".."
default-features = false

[[bin]]
name = "acpi_tables"
path = "fuzz_targets/acpi_tables.rs"
test = false
doc = false
bench = false

