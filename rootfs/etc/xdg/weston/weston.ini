# weston on mpos: a rootful, software-rendered compositor on the framebuffer.
#
# mpos exposes a 2D scanout at /dev/fb0 and - for a DRM-capable compositor - a
# software /dev/dri/card0. There is no 3D/GL and no gbm/EGL driver. weston's
# fbdev backend + pixman renderer is the combination this display path actually
# drives (it paints CPU pixels into /dev/fb0 and presents via FBIOPAN_DISPLAY).
#
# NOTE: because /dev/dri/card0 exists, weston AUTO-SELECTS its DRM backend,
# which needs gbm/EGL and a loadable drm-backend.so. Select the framebuffer
# backend explicitly, IF the image ships one:
#     weston --backend=fbdev-backend.so --renderer=pixman
# mpos has no GL/Vulkan driver, so weston needs the software (pixman) renderer
# AND a CPU backend (fbdev or headless) present in /usr/lib/libweston-*. The
# Alpine edge weston package does NOT ship fbdev/headless backends or the
# pixman renderer (only gl-renderer / vulkan-renderer), so a stock `weston`
# from apk cannot display on mpos. See rootfs/root/start-weston.sh, which
# detects this and says so rather than dying on a missing module.
[core]
renderer=pixman

[shell]
# No screen-blanking or idle: a dev loop wants the window to stay lit.
locking=false

[libinput]
# The virtio tablet is absolute; tap/accel are irrelevant here but harmless.
enable_tap=false
