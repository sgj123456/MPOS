# weston on mpos: the DRM backend and the GL renderer, software-driven.
#
# mpos exposes a KMS card at /dev/dri/card0 (with a render node beside it at
# /dev/dri/renderD128) that weston's DRM backend drives: seatd hands it the
# card as master, it binds dumb buffers through GBM, and llvmpipe - Mesa's
# software GL driver - does the rendering, all in CPU memory. There is no
# GPU-side GL in this stage; the kernel presents page-flipped framebuffers to
# the virtio-gpu scanout.
#
# The renderer is named because the stock Alpine weston also lists a pixman
# renderer it does not ship a module for: `renderer=gl` keeps weston off that
# missing module and on the one this image carries (gl-renderer.so).
#
# `require-input=false` is what lets the compositor come up on a machine whose
# input devices are present but not yet *identified*: libinput takes a device
# from udev, and a device udev has not tagged has no `ID_INPUT` property, so
# libinput passes it over and weston - whose default is to insist on input -
# exits with "no input devices on entering Weston". The kernel side of that
# path (the `/sys/dev/char` tree, and a uevent write that actually emits an
# event so `udevadm trigger` can cold-plug) is still to come; until it lands,
# this says out loud what the machine is: a display that runs without input.
[core]
renderer=gl
require-input=false

[shell]
# No screen-blanking or idle: a dev loop wants the window to stay lit.
locking=false

[libinput]
# The virtio tablet is absolute; tap/accel are irrelevant here but harmless.
enable_tap=false

[launch]
path=/usr/bin/weston-terminal
