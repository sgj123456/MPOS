# weston on mpos: a rootful, software-rendered compositor on the framebuffer.
#
# mpos exposes a 2D scanout at /dev/fb0 and no DRM/GL device, so weston runs
# its fbdev backend (chosen automatically when /dev/dri is absent) with the
# pixman software renderer - the one combination this kernel's display path
# actually supports (3D/virgl is deliberately out of scope). Start it on the
# compositor boot: `cargo xtask run --console compositor`, then `weston` as
# root (no seat/logind is present, so it runs rootful against /dev/fb0).
[core]
renderer=pixman

[shell]
# No screen-blanking or idle: a dev loop wants the window to stay lit.
locking=false

[libinput]
# The virtio tablet is absolute; tap/accel are irrelevant here but harmless.
enable_tap=false
