# QEMU user networking's built-in forwarder. The guest's own resolver is
# 10.0.2.3; anything on the other side of the user-mode NAT is resolved by
# QEMU on the host, which is what makes `apk` and `curl` work with no network
# setup in the guest at all.
#
# This is the default: a set `[system] dns` in rootfs.toml rewrites this file
# at build time, so the guest asks that server directly instead - slirp
# carries the queries to any address the host can reach.
nameserver 10.0.2.3
