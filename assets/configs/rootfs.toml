# rootfs.toml - what the guest image *contains*.
#
# Read by `cargo xtask disk`, `rootfs`, `initramfs` and `run`, for both machines.
# The parser is a small one: `key = value`, one array per key (which may be
# written across several lines), and three sections. `[default]` is the baseline
# both machines read, `[x86_64]` and `[aarch64]` are each machine's own half, and
# a machine's key wins over the baseline's. A key carries the name of the thing
# it belongs to (`rootfs.mirror`, `system.hostname`, `user.name`).
#
# One file describes both machines, and they are one guest: each boots the same
# desktop userland - weston, mesa, the DRM stack, seatd - so the package lists
# below are the baseline's and neither machine's half names a package. What
# differs between the two is a hardware fact and is written under the machine's
# own name; `rootfs.serial_port` is the one such key left. The mirror, the
# repositories, the filesystem, the timezone and the resolver are the baseline's
# for the same reason.
#
# How the image is *booted* is `machine.toml` beside this file, and that is a
# cost decision rather than a tidy one: this file's mtime is what decides whether
# the Alpine tree is reinstalled, so a key that has nothing to do with the
# image's contents (a memory size, a window backend, the standing run mode)
# would charge a full package install for a change it has nothing to do with.
# The two keys here that are neither contents nor geometry - `system.hostname`
# and `rootfs.serial_port` - stay because they are written into the image;
# `machine.toml` reads them through rather than naming them a second time.
#
# One consequence of one file per kind, now that both machines read this one:
# both stamps compare against it, so editing the second machine's half
# re-installs the first machine's tree too (and the other way round). That is the
# price of one file, and it is a price the shared half already charged.
#
# A file that does not need a value from here lives in `rootfs/` as a real file
# instead: /etc/inittab, /etc/network/interfaces, /etc/resolv.conf and
# /etc/doas.conf are all editable there, and everything written from this file
# is applied before the overlay - so a file in the tree wins. One exception is
# `system.dns` below: a set value rewrites /etc/resolv.conf after the overlay.

[default]
# Alpine mirror URL
rootfs.mirror = "https://mirrors.tuna.tsinghua.edu.cn/alpine"
# Alpine branch
rootfs.branch = "edge"
# The machine itself is deliberately not a key here. The package architecture
# apk resolves against is the `--arch` the build was given (`xtask/src/arch.rs`
# is the one place a machine is named), so a `rootfs.arch` spelling would only
# be a second answer that could disagree with the one the kernel and the loader
# were built for.
# The repository components to fetch, in this order: apk takes a package from
# the first repository that has it, so `main` before `community` is what keeps a
# package that exists in both coming from the one it belongs to.
rootfs.repos = ["main", "community"]
# Filesystem for the root partition. This kernel routes ext2, ext3 and ext4 to
# the same driver, so any of the three boots; ext4 is what the image ships.
rootfs.filesystem = "ext4"
# How the guest sees the root device (virtio disk in QEMU). Both machines boot
# the same shape - a GPT whose first partition is the ESP and whose second is
# the ext4 root - so both name `/dev/vda2`, the second block device's second
# partition (`NOTES.md` §15.18; the second machine's bare-image deviation is
# gone).
rootfs.root_device = "/dev/vda2"
# Serial port the kernel's console goes to, named on the kernel command line as
# `console=ttyS0`. It is the same name the image's getty runs on. The second
# machine's console is a PL011, so its half names `ttyAMA0` - one node either
# way, named the way the machine's psABI names the port.
rootfs.serial_port = "ttyS0"
# Disk image size. Read for **both** machines: each has its own image file
# (`mpos-uefi-x86_64.img`, `aarch64-disk.img`) created at this size, and the
# second machine's is a GPT of the same shape rather than the bare filesystems
# it used to carry.
rootfs.image_size = "2G"
# EFI System Partition size. It holds the loader, the kernel and the initramfs
# and nothing else, so it only has to grow if those do. Read for both machines
# for the same reason `image_size` is.
rootfs.esp_size = "128M"
# `mke2fs -O` features, comma-separated. The driver cannot honour two of the
# defaults: a journal (nothing here replays one, and a crash would leave the
# filesystem asking for a recovery this kernel cannot do) and metadata checksums
# (every write would leave a stale one behind). An empty list means "whatever
# mkfs decides".
rootfs.mkfs_options = "^has_journal,^metadata_csum"

# Base packages that are always installed (do not modify unless needed).
# `alpine-base` and `openrc` arrive through the shared core list
# (`SHARED_BASE_PACKAGES` in xtask/src/rootfs.rs, folded into every machine's
# base by config.rs) - what is named here is on top of that core: the
# filesystem tools a guest with disks and partitions needs to *make* them.
# Both machines read this baseline list and so both carry them; the second
# machine's image is laid by the build on the host rather than by the guest,
# but it is one userland and a package list that is right for one is right
# for the other.
rootfs.base_packages = ["e2fsprogs", "dosfstools"]

# Additional packages to install in the rootfs, on top of the base ones.
# `doas` is the privilege escalation tool this image ships - not sudo, which
# is deliberately absent. The graphics stack is weston on the DRM card:
# `weston-backend-drm` is the backend module (the weston package ships only
# the gl renderer, no fbdev backend, so DRM+GL is the one display path), and
# the mesa packages bring GBM/EGL and the software GL driver. `mesa` is the
# gallium core and `mesa-dri-gallium` the DRI drivers themselves (swrast and
# kms_swrast - llvmpipe; nothing depends on that package, so it has to be
# named). mesa-egl/gbm/gl/gles and libdrm arrive as apk dependencies of the
# tools. `mesa-utils` is `eglinfo`, `kmscube` the first end-to-end probe of
# DRM+GBM+EGL before weston enters.
#
# The `-openrc` packages are the service scripts themselves - Alpine keeps
# them in subpackages, so a daemon without its `-openrc` half has no
# `/etc/init.d` entry for a runlevel to point at. `seatd-openrc` is the seat
# manager weston's DRM backend gets its card and console from; `dbus-openrc`
# is the session bus a stock Wayland setup starts (`setup-wayland-base`
# enables it); `busybox-openrc` carries the syslog and crond scripts the
# stock boot runlevel wants. Which of them the image actually starts is in
# `xtask/src/rootfs.rs` (`SERVICES`), not here.
#
# Both machines install this list: it is one userland, and neither machine's
# half replaces it - the desktop that reaches a compositor is the tree both
# boot.
rootfs.extra_packages = [
    "busybox-openrc",
    "alpine-release",
    "ssl_client",
    "ca-certificates",
    "apk-tools",
    "fastfetch",
    "strace",
    "doas",
    "weston",
    "weston-backend-drm",
    # The desktop shell itself. Alpine keeps each shell in a package of its
    # own, and `weston` alone is a compositor with nothing to run: the default
    # `shell=desktop-shell.so` is not in it, so a boot without this one dies
    # with "Failed to load module: ... desktop-shell.so: No such file or
    # directory" and never draws anything.
    "weston-shell-desktop",
    "weston-terminal",
    # The pointer's own artwork. Weston draws the cursor from an Xcursor theme,
    # and this image shipped none - /usr/share/icons held only the `hicolor`
    # icon tree, which has no `cursors/` - so weston drew the small built-in
    # arrow libwayland-cursor carries for exactly that case: one fixed image
    # that does not follow the output scale and does not survive being scaled,
    # which is the whole of a pointer that "does not grow, only blurs".
    # `breeze-cursors` is cursor-only - no icon tree to carry, and the only
    # libraries it wants are the ones its loader already needs - and it ships
    # every shape at 16..96 px, so a request in that range is a native image
    # rather than a resample. Which theme weston picks is named in
    # /etc/xdg/weston/weston.ini.
    "breeze-cursors",
    # `lspci`/`setpci`, which read the tree `/sys/bus/pci` and `/proc/bus/pci`
    # publish. Nothing in the boot needs them; they are here because the PCI
    # tree exists to be read by exactly this program.
    "pciutils",
    "mesa",
    "mesa-dri-gallium",
    "mesa-utils",
    "kmscube",
    # The second compositor family, installed to be *measured* rather than
    # shipped as a working desktop - and the measuring is not about a missing
    # package, which is why it is worth writing down here. niri's TTY backend is
    # `GpuManager<GbmGlesBackend<GlesRenderer>>` and nothing else, and it refuses
    # a software EGL device outright (`ensure!(!egl_device.is_software(),
    # "software EGL renderers are skipped")`, niri 26.04). On this image's 2D
    # `virtio-gpu-pci` card Mesa offers llvmpipe and nothing else, so niri starts,
    # fails to make a renderer, and listens with no output; changing that is a
    # card and a Mesa chain rather than a package, and `docs/notes/` §7.4 is
    # where the chain's state is recorded. Installing it here is what makes the
    # observation repeatable by a boot instead of by someone's `apk add`.
    "niri",
    # niri's Xwayland helper. Without it niri logs `error spawning
    # xwayland-satellite at "xwayland-satellite", disabling integration: No such
    # file or directory` and runs without X support - one warning about a binary
    # the image simply did not carry.
    "xwayland-satellite",
    "seatd",
    "seatd-openrc",
    # udev, and the reason a compositor can see a keyboard at all: libinput
    # takes its devices from udev and passes over any device udev has not
    # tagged `ID_INPUT=1` - a tag udev sets by running its rules over the
    # device's uevent. Without udevd a machine has evdev nodes that nothing
    # will ever read. `udev-init-scripts-openrc` carries the three services
    # (`udev`, `udev-trigger`, `udev-settle`); `eudev-openrc` the hwdb step
    # they depend on.
    "eudev",
    "eudev-openrc",
    "udev-init-scripts-openrc",
    # libinput's own udev rules (device groups, fuzz overrides) and its
    # diagnostic tool: `libinput list-devices` is how a machine is asked
    # whether its input is real.
    "libinput-udev",
    "libinput-tools",
    "dbus",
    "dbus-openrc",
]

# The machine the guest is: its name, its clock and its logins. Both machines
# are the same guest in every one of these, so they are the baseline's.
#
# Hostname, written to /etc/hostname and /etc/hosts - and the name the guest
# reports to QEMU's DHCP server.
system.hostname = "mpos"
# Timezone. `UTC` costs nothing and needs no package; any other zone wants a
# symlink to /usr/share/zoneinfo/<zone>, which needs `tzdata` in the list above.
system.timezone = "UTC"
# Locale, exported from /etc/profile.d/locale.sh. musl takes it from the
# environment rather than from a generated table, so there is nothing else to do.
system.locale = "en_US.UTF-8"
# The nameserver the guest's own resolver asks, written into /etc/resolv.conf
# over the stock `10.0.2.3` the tree ships. Unset, QEMU's user-mode network
# answers 10.0.2.3 itself - by forwarding to whatever the host's own
# resolv.conf names, which on a systemd-resolved host is the 127.0.0.53
# loopback stub, and which no QEMU option can redirect (its `dns=` renames the
# address slirp answers at; it does not name an upstream, which is why the
# build never passes it). Set, the guest asks this server directly: slirp
# carries the queries to any address the host can reach. One kernel-wide fact,
# which is why both machines read this one line.
system.dns = "223.5.5.5"
# Root's password. Empty means "nothing to type", which is what a serial console
# with no keyboard needs; anything else is set with chpasswd.
system.root_password = ""

# The account created in the guest, besides root. An empty `name` skips the
# whole thing and leaves an image that only ever logs in as root; both machines
# name the same account here, so it is written once.
#
# The two machines make it differently, and the difference is what a build can
# *run*: the first machine's account is made by the image's own `adduser` in a
# chroot, and the second's by `rootfs::create_account_without_chroot` writing the
# same three files (`/etc/passwd`, `/etc/group`, `/etc/shadow`), because this
# host cannot exec an aarch64 tree. A non-empty `password` is refused on the
# second machine either way: hashing one is the image's own `crypt(3)`.
user.name = "mpos"
# Groups to add it to. `wheel` is the one /etc/doas.conf grants escalation to;
# `seat` is the group the seatd service hands its socket to, so an account
# that is not root can still start a compositor (seatd's own package makes
# the group, and root is let through regardless).
user.groups = ["mpos", "wheel", "seat"]
# No `user.shell`: the account takes the build's default, `/bin/sh`, which on
# Alpine is busybox's `ash` - the same shell `root` gets, and the only shell
# this image carries.
# Empty means the account has no password to type, like root above. Anything
# else is set with chpasswd.
user.password = ""

# The first machine's own half - every value it reads is one of the baseline's,
# because the baseline was written from this machine. A value that stops being
# shared moves up into the baseline only if both machines want it; one that only
# this machine wants belongs here.
[x86_64]

# The second machine's own half, and it is a hardware fact and nothing else.
#
# The keys are the same vocabulary the baseline uses, read by the same
# `RootfsConfig::load`, so nothing here is a dialect. What is absent is as
# deliberate as what is present: both machines boot the same userland, so no
# package is named here, and what is left is the one name a machine really owns -
# the port its console answers on. The bus it enumerates and the card behind it
# are the driver layer's facts, not this file's.
[aarch64]
# The PL011 - the name this machine's console is called everywhere else, on the
# `console=` word the image is booted with and on the getty line its inittab
# renders. `rootfs.root_device` is the baseline's: both machines' roots are the
# second partition of their own GPT disk.
rootfs.serial_port = "ttyAMA0"

# How the image is *booted* - the window, the memory, the devices and the
# standing run mode - is `machine.toml` beside this file. It is a separate
# file on purpose: this one's stamp is compared against the image, so any edit
# here reinstalls the Alpine tree, and a memory size has no business doing
# that. `image_size` and `esp_size` stay here because changing either
# re-makes the partitions and their filesystems, which is a rebuild this file
# should ask for.
