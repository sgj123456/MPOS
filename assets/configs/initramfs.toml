# initramfs.toml - what the early userspace contains.
#
# Read by `cargo xtask initramfs`, which packs the archive the kernel unpacks as
# its first root filesystem. It wants a shell, the tools to mount with, and
# `/init` - which is a file in the `initramfs/` tree, applied as an overlay, so
# editing it is editing a script and not this crate.
#
# The sections work as they do in `rootfs.toml` and `machine.toml`: `[default]`
# is the baseline both machines read, each machine's own half overrides it, and
# `xtask/src/config.rs::parse_sectioned_toml` reads those three headers alone.
# `initramfs.arch` is the *package* architecture apk resolves against, so each
# half names its own - unlike the loader and kernel targets, which xtask picks
# from its own `--arch`.
#
# Since `NOTES.md` §15.6 both machines switch root from their initramfs's script
# rather than one of them doing it in the kernel, so the archive is the same
# shape on both: a shell, the tools to mount with, and `/init`. What differs is
# where the packages come from and which set of them is needed - the second
# machine's set is pinned in code (`xtask/src/initramfs.rs`), because its archive
# needs exactly a shell, `mount`, `switch_root` and `pivot_root`, and every name
# added costs the boot a file it does not need.

[default]
# Alpine mirror URL
initramfs.mirror = "https://mirrors.tuna.tsinghua.edu.cn/alpine"
# Alpine branch
initramfs.branch = "edge"
# Architecture. Each half names its own; this is the baseline's.
initramfs.arch = "x86_64"
# The repository components to fetch, in the order apk should look in them.
initramfs.repos = ["main", "community"]

# Base packages that are always installed (do not modify unless needed). Read
# for the first machine alone: the second's set is pinned in code, so a name here
# would be a name that machine never installs.
initramfs.base_packages = ["busybox", "alpine-baselayout", "apk-tools"]

# Additional packages, added on top of the base ones, are named by
# `initramfs.extra_packages` - and neither machine needs any, so the key appears
# nowhere and the empty default is what both halves get. A name here costs the
# archive a file; the boot scripts need none, so this stays empty unless a test
# adds a tool its payload execs.

# The first machine's own half - every value it reads is one of the baseline's.
[x86_64]

# The second machine's own half.
[aarch64]
# This is the one key it does not share: a cross-arch `apk` is asked for this
# machine's packages, and the loader/kernel targets are xtask's own choice.
initramfs.arch = "aarch64"
