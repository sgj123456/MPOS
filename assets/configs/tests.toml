# tests.toml - which user test programs the self-test sweep runs.
#
# `cargo xtask test` builds every program and boots the ones that are in **no
# group**. A test is left out of that default sweep by being named in a group
# here, and the reason is always the same shape: it needs something that is not
# the machine under test, or it measures instead of asserting, or it is not a
# check at all. What that buys is the only thing a gate is for - a red default
# sweep means the kernel, rather than the internet, the host's resolver, or a
# host that happened to be busy.
#
#   cargo xtask test                     # the ungrouped tests, plus `default`
#   cargo xtask test --groups slow       # the ungrouped tests, plus `slow`
#   cargo xtask test --all-groups        # everything, groups and all
#
# A group name the file does not define is an error rather than a quiet no-op,
# and so is a name here that no built program answers to: running fewer tests
# than the caller asked for is the one failure this must not have. A test may
# appear in more than one group, and then runs when any of them is asked for.
#
# The file is written in the three sections every config file in this tree uses:
# `[default]` is the baseline both machines read, and `[x86_64]`/`[aarch64]` are
# each machine's own half. A group under `[default]` binds both sweeps; a group
# under a machine's own section is that machine's alone and invisible to the
# other, and it is *added* to the baseline's group of the same name rather than
# replacing it - so `[aarch64] external = ["t-x"]` names one more program that
# needs the internet there, without answering what `external` means elsewhere.
#
# The parser is the small one `rootfs.toml` uses: `key = value`, one array per
# key (which may be written across several lines), and a key before any header -
# or under a header that is not one of the three - is an error rather than a
# group that silently stops leaving its tests out. Group order in the output
# follows the name, not the line.

[default]

# Groups a plain `cargo xtask test` adds to the ungrouped tests. Empty - the
# shipped value - means "the ungrouped ones", which is what the sweep should be:
# everything that is a check of this machine and of nothing else.
default = []

# How long one program may run before the runner kills it and carries on with
# the next one, in seconds. This is a *program's* budget, not the sweep's: the
# lane still has its own 900-second deadline (`MPOS_TEST_TIMEOUT`), but a single
# stuck test used to spend that whole budget and hide every program after it.
# Now it costs its own budget and prints `=== FAIL <name> timeout=<n>s`, so the
# failure is named and the rest of the suite still runs.
#
# The shipped default covers every default-sweep program with room for a busy
# TCG lane; `t-fill-ramfs` writes up to 1 GiB and is the one slow-group program
# that needs a longer budget, so it gets its own line. A machine's own section
# may override either key for its hardware. Read by both the guest runner (the
# harness writes these values to the host share) and `cargo xtask test-host`, so
# the two paths cannot drift.
timeout = 120
timeouts = ["t-fill-ramfs=600"]

# Needs something outside the machine: the host's network, through QEMU's
# user-mode stack, or a program listening on the host. A red one of these is a
# statement about the internet or the host's own services before it is a
# statement about the kernel - which is why the default sweep leaves them out,
# and why they are worth running on purpose. The reason is the same on both
# machines: slirp's DHCP server and the host's resolver are outside either of
# them.
#
#   t-dns, t-stdresolve  resolve real names through the host's resolver
#   t-udp                sends a DNS query to 10.0.2.3 and reads the answer
#   t-rawicmp            pings a public address (110.242.74.102) and compares
#                        what it reads against what the host's own ping gets.
#                        The comparison *is* the test, so the internet is one
#                        of its two halves: when the host cannot reach that
#                        address - filtered, rate-limited, or the path merely
#                        slow - what fails is not the machine under test. It
#                        blocked three of four sweep runs while this file
#                        listed it as a machine check, and the same kernel
#                        answered 3/3 from the run machine minutes earlier.
#   t-raw-recvmsg        the same peer, for the same reason: a guest's raw
#                        socket lives on `eth0` and never on the loopback, so
#                        every shape it pins - the zero-length room, the peek,
#                        the truncation word, the chain, the fault - starts
#                        from one queued packet, and the packet comes from
#                        beyond slirp. What it asserts is the door's own
#                        answers, which is what makes the internet a
#                        prerequisite rather than the subject.
#   t-tcp-close          needs a listener on the host's 127.0.0.1:4599; with
#                        none it prints `skip:` and passes, so it is a probe
#                        and not a gate in either state
#   t-dhcp               the BOOTP answer it waits for is the host's slirp's,
#                        not this machine's: a red one says the host's DHCP
#                        server or its link is the thing that changed. The
#                        *door* - the AF_PACKET socket, its name and its bind
#                        - is this machine's, and is the part the program
#                        asserts before it sends.
external = ["t-dhcp", "t-dns", "t-rawicmp", "t-raw-recvmsg", "t-stdresolve", "t-tcp-close", "t-udp"]

# Slow, or a measurement rather than an assertion. `t-fill-ramfs` writes up to
# 1024 MiB a chunk at a time; the other three are instruments whose numbers are
# the point and whose verdict can depend on how busy the host is (§10.2, §10.4
# carry their figures).
#
# The two §10.5 programs stay in the **default** sweep rather than here, and
# that is a decision with a reason: their claims are exact device-read counts,
# not timings, so they are as stable as the cache tests' mock counts were — and
# `t-diskbench`'s warm pass asserting `warm=0` is the regression pin the cache
# policy has on the machine, which only a default-group program is. They also
# arm the boot's disk-counter protocol through their own membership (a plain
# sweep stages them, so its command line carries `mpos.diskstat`; move either
# name here and the arming follows automatically), and the harness refuses an
# armed run whose instrument left no reading behind.
#
# `t-netstats` joins them in the **default** sweep for the same shape of
# reason: its claims are exact frame counts read off `/proc/net/dev` after a
# fixed 256-datagram burst - one per sent datagram, an arithmetic fact about
# the seam rather than a timing - while the datagrams-per-second figure it
# prints is §10.4's before/after number and follows t-pipecost's "reported,
# not asserted" rule. The harness likewise refuses a sweep that staged it but
# saw no `NETSTAT` line.
slow = ["t-fill-ramfs", "t-forkcost", "t-netlat", "t-pipecost"]

# Not a check at all. `t-sh` execs an interactive busybox ash onto the console
# and prints what it observes about where the shell stopped; it is here to be
# run by hand when a shell problem needs looking at. `t-aa-ptyprobe` is the same
# shape from the pty batch - descriptor identities and "did this call block" with
# no claim to fail on, its header still saying it was for that batch's debugging.
# It was being booted by the default sweep, which is what the diagnostic group is
# for (`docs/notes/` §15.93). This is the one group that
# is the same thing on both machines for a reason beyond the harness: a
# measurement instrument (`t-forkcost`, `t-netlat`) is a different instrument on
# each machine, so running it on both is right, but a diagnostic is one thing
# everywhere - and §15.34's rule bounds what a boot may assert by what the
# kernel itself produces, which an interactive child's state letter is not.
diagnostic = ["t-sh", "t-aa-ptyprobe", "t-ptrace-stops"]

# The first machine's own half. Empty, and an empty section is that machine's
# answer rather than a missing one: every group it needs is a group the baseline
# already carries, and an `[x86_64]` with nothing under it says so in the place
# a reader would look for it.
[x86_64]

# The second machine's own half, and the only group in it is `gaps` - what
# aarch64 cannot serve yet.
#
# `gaps` is different in kind from every other group in this file: it is an
# exclusion rather than a reason. A reason can be asked for by name
# (`--groups external`) because a program that needs the internet is a program
# someone may want to run; a gap cannot, because a machine has no call for what
# it cannot serve - `--groups gaps` is refused, and `--all-groups` still leaves
# these out. Being written *here* rather than in `[default]` is what makes it
# honest: the group is invisible to x86_64's sweep, so a test it lists stays in
# the first machine's default sweep exactly as it did before - what changes is
# the aarch64 arm, which leaves it out and prints it by name rather than
# reporting it as a failure or skipping it silently. The way to shrink this
# group is to make the call work, not to edit a list of things nobody runs
# (`docs/notes/` §13.4/§13.5).
#
# Two families left it, both by making the call work:
#
#   * the socket family - eleven names, every one of them stopping at `socket(2)`
#     with ENOSYS because this machine had no stack. §13.4's flip gave it one (the
#     MMIO adapter the boot's `check_net` opens and hands to `net::init`), and the
#     whole family now runs: `t-socket`, `t-sockmsg`, `t-sockopt`, `t-tcp`,
#     `t-tcp-listen`, `t-udp-loopback` and `t-unix-rustix`, including a TCP
#     connect/accept/read-write round trip over the stack.
#
#   * `t-socketpair` and `t-stdspawn`, whose subject is *other programs*
#     (`t-stdspawn` runs /bin/true, /bin/echo, /bin/cat, /bin/false and
#     /bin/sh -c; `t-socketpair` runs /bin/cat). That was a gap in the harness
#     rather than in the ABI - the x86_64 root is an initramfs with busybox in
#     /bin, and the second machine's ext4 root carried no /bin at all. It carries
#     one now, built in-tree (`xtask/src/aarch64_bin.rs`), because the toolchain
#     was already a prerequisite of this sweep whereas installing busybox would
#     have put a network fetch inside the gate.
#
# One name sits here now, and its reason is the architecture rather than a
# missing handler. (A second sat beside it for the same kind of reason - the
# clock's - and left the day the machine grew the wake that serves the call:
# `t-sleep-subtick` ran on the first machine alone while the second's sleeps
# rounded up to a tick, and the EL1 *virtual* timer is what closed it - a
# second comparator, independent of the one the tick runs on, armed by the
# scheduler at the earliest wait the next tick would be too late for. The
# program now asserts its distribution on both machines, and the gap's way
# out was the machine's own answer, not an edit to a list: `docs/notes/`
# §10.7/§13.)
#
#   t-arch-prctl  `arch_prctl` is x86_64's own call (arm64 has no number for
#                 it - TLS goes through other doors there). The program builds
#                 on both machines and says "skipped" on the second; naming it
#                 here keeps the sweep's question honest on both.

[aarch64]
gaps = ["t-arch-prctl"]
