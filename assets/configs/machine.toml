# machine.toml - the machine `run` and `test` boot the image on.
#
# This is the *host* half of the build: how QEMU is wired, and how much of the
# host's resources the guest is given. None of it is copied into the image, so
# editing it must never invalidate one - which is the whole reason it is not in
# `rootfs.toml`. That file's stamp is compared against the file's mtime, so
# anything written there costs a full reinstall of the Alpine tree (thirty-odd
# packages over the network) even when what changed was a memory size.
#
# The two files divide like this:
#
#   rootfs.toml   what the image *contains* - the packages, the files written
#                 into it, and its own disk geometry (`image_size`, `esp_size`:
#                 changing those re-makes the partitions and filesystems, so a
#                 rebuild is exactly what should happen).
#   machine.toml  what the image is *booted on* - the window, the memory, the
#                 devices QEMU attaches, and the standing run mode.
#
# Two keys cross that line, and both are read through rather than duplicated:
# `system.hostname` in `rootfs.toml` is also the name QEMU's DHCP server is told
# (one machine has one name, so it lives where it is written into the image), and
# `rootfs.serial_port` names the port the boot console and the getty share.
# Neither is a key of this file.
#
# A device this file turns off is a device the guest does without; a run
# overrides the memory for one boot with `MEM=`.
#
# One file, two machines, in three sections. `[default]` is the baseline both
# machines read; `[x86_64]` and `[aarch64]` are each machine's own half, whose
# keys win over the baseline's. A value is therefore written once - in `[default]`
# where the two agree, under the machine's own name where they do not - and
# neither machine can see the other's. `xtask/src/config.rs::parse_sectioned_toml`
# reads exactly these three headers and refuses any other one, because a key under
# a header nothing reads is a value dropped in silence, and a machine booted on
# defaults is not a machine anyone asked for.

[default]
# QEMU memory, in MiB. The first machine is a desktop with a compositor and a
# graphics stack behind it, so it spends the host's memory; the second boots a
# disk root and a shell, and its own figure was measured down rather than chosen
# (`NOTES.md` §9.1's device RAM cost) - it is in `[aarch64]` below.
qemu.memory = "2048"
# Processors. One is QEMU's default; a second one is what exercises the kernel's
# bring-up of another processor, which is why the option is here.
qemu.cpus = 1
# Appended to the QEMU command line verbatim, after everything the build
# computes. One argument per element, and an element may not contain a comma -
# the list is comma-separated on the way in.
#
# `-vga none` drops QEMU's implicit primary VGA, which the SDL/GTK backend
# otherwise opens a second window for: OVMF draws its firmware text on that card
# while the kernel drives the virtio-gpu one, so an interactive gui/mirror boot
# shows two windows. With it gone only the kernel's virtio-gpu window remains,
# and the firmware's few lines reach the serial log (gui) or the terminal
# (mirror) instead of a screen. The second machine refuses the option outright -
# `-machine virt` has no `-vga` - so its own section writes the key again, empty.
qemu.extra_args = ["-vga", "none"]
# The virtio-vsock device (`-device virtio-vsock-pci,guest-cid=3`), for
# `socket(AF_VSOCK)` to the host: the guest's cid is 3, the host answers on
# cid 2. Off unless the host has the vhost kernel module it needs - QEMU
# refuses to start without it, and a boot that never starts is worse than a
# machine with no vsock. `ls /dev/vhost-vsock` is how you know.
#
# The second machine shares this value and adds a condition of its own on top of
# it: its wiring asks for the same module before attaching the MMIO form of the
# device, because QEMU refuses to start a machine that names it without
# `/dev/vhost-vsock` - a host that cannot carry it gets a machine that boots and
# a kernel that answers `EAFNOSUPPORT`, not a machine that never starts
# (`NOTES.md` §13.28). That condition is the wiring's rather than a key's
# (`xtask/src/qemu.rs::virt_machine_args`), so nothing here is said twice.
qemu.vsock = true
# The virtio-sound card, with an audio backend that plays nowhere: the guest
# exercises the driver and /dev/dsp, the host hears silence. Needs QEMU 8.2
# or newer for the card to exist at all.
qemu.audio = true
# The GPU device QEMU attaches (`-device`). `virtio-gpu-gl-pci` is the virtio-gpu
# device with the host's `virglrenderer` behind it, and it is what a boot on this
# host gets: it is the only way this machine has ever had a hardware renderer
# (`eglinfo -B` answers `virgl (AMD Radeon 780M ...)`, where every boot before it
# answered `llvmpipe`), and it is what a compositor needs - niri refuses a
# software EGL device, and with §7.4's four answers in place it comes up on it:
# `putting output Virtual-1 at x=0 y=0`, `listening on Wayland socket:
# wayland-1`. It does ask the *host* for a render node, so a host without one
# (`/dev/dri/renderD128` absent) wants the 2D card below - one key, and every
# boot before 2026-10-14 used it.
#
# `virtio-gpu-pci` is the 2D scanout, and it is what the **gate** boots - the one
# boot that cannot carry the GL card, measured 2026-10-14 on this same host. The
# guest half is green on the GL card (`=== SUMMARY pass=170 fail=0` and
# `mpos-kunit 30 passed, 0 failed`), but QEMU does not survive the boot's *end*:
# after the guest writes its debug exit it dies with SIGSEGV inside the **host's**
# own `libgallium`, reached from QEMU's `egl_cleanup` during `qemu_cleanup`
# (`coredumpctl`: `#15 egl_cleanup (ui-opengl.so)`). That is a host Mesa teardown
# crash and not a refusal this kernel could answer, so the gate's exit-33 check
# reads `-1` and would never call the run green - which is why
# `xtask/src/selftest.rs` overrides the card back to this one for its own boot,
# the same way it already drops the vsock bus. `cargo xtask run` keeps the GL
# card; only the sweep does not;
#   * and one line the GL boot prints that nobody needs to chase: the *suite's*
#     own 3D create asks for a cube-map target with `array_size` 1, which is not
#     a legal cube map, and virglrenderer prints
#     `vrend_resource_create, Illegal resource parameters, error: Cube map:
#     unexpected array size 1` - and answers it anyway, so nothing fails.
# Both are recorded with the rest of the renderer chain in `docs/notes/` §7.4.
#
# What the GL card *does* fix is `DRM_VIRTGPU_GET_CAPS`: with `capsets=2` the
# request is served (`virtio-gpu: virgl=1 context_init=1 capsets=2 cached=2`),
# where a 2D card answers `ENOSYS` - which is Linux's own answer for a card with
# no cap sets, and not a gap this kernel could close by answering something else.
# And it is the only way this machine has ever had a hardware renderer: §7.4
# carries the four answers that stood between `virtio-gpu-gl-pci` and a picture
# (a `VERSION` triple Mesa's virgl path refuses; a resource id that was two
# numbers rather than the one handle; the encoder `OBJ_GETPROPERTIES` refused;
# and a zero-length `VERSION` field whose pointer was checked anyway). With all
# four, niri comes up on it - `putting output Virtual-1 at x=0 y=0`, and
# `wayland-1` listening - which no earlier boot of this machine ever did.
qemu.gpu = "virtio-gpu-gl-pci"
# The QEMU display backend for an interactive `run` (`-display`), so the
# framebuffer console has a window to show itself in. Absent means `sdl`; name
# another backend your QEMU was built with, or `none` to watch only the serial
# log - which then goes quiet once the console moves to the framebuffer.
#
# Absent, deliberately: the 2D card above takes any backend. A GL card must be
# named beside a backend that has OpenGL - `sdl,gl=on` on this host, measured,
# where `none` is refused outright - and a boot that renders nowhere derives its
# backend from the card instead of reading this key (`xtask/src/qemu.rs`), so the
# key stays about the window and nothing else.

# How `cargo xtask run` boots the machine, overridable per invocation with
# `--mode <mode>`. One word picks both the QEMU wiring and the consoles the guest
# is told to use, because the window and the guest's own console have to agree.
# There are three of them, because there are two questions to answer — is there a
# window, and is the framebuffer one of the guest's consoles — and every mode
# keeps the serial line, because a mode that dropped it dropped the kernel log
# with it; `gui` reads that line from a log file rather than the terminal:
#   terminal - serial only, no window. The guest is given `console=ttyS0`, so the
#              wire is its only console and the whole boot rides it losslessly;
#              the display device is still probed, and `/dev/fb0` still answers,
#              but nothing is drawn on it;
#   gui      - the whole machine in the window: a window with every device behind
#              it (GPU, keyboard, absolute tablet, DRM) and `console=tty0`, so the
#              boot log, the virtual consoles, the login prompt and the shells all
#              show *in the window*, and the host terminal shows nothing. The
#              guest never names the wire, so the kernel's console bytes go to the
#              screen alone; the launcher still taps the port, into
#              `build/serial.log`, because the UEFI loader's lines, the kernel
#              banner that precedes the command-line parse and a panic's forced
#              serial report reach no screen. A compositor is a guest of runtime,
#              not of this word: log in on the window's tty1 and run
#              `./start-weston.sh`, and the session claims the card, the kernel
#              text stops painting over it, and `^A 1`..`^A 6` — the kernel's own
#              mux, read from the window's keyboard — switches back to the console
#              and away again;
#   mirror   - `console=ttyS0 console=tty0`: the window takes the console over
#              once the framebuffer is up, and the wire keeps a best-effort copy
#              of the same text on the host terminal. Under a flood the serial
#              transcript may drop bytes while the window never stalls.
# Unset means mirror, which is what `run` did before the modes were split. A name
# this xtask does not have — including the retired `weston` and `compositor` — is
# an error at `run`, not a default: the two bake different `console=` lists, so a
# silent fallback would boot a machine nobody asked for. A `cargo xtask test` boot
# ignores this: its command line is its own, and it names the wire alone.
#
# This one key is also baked into the image (`mpos.cmdline`), so changing it is
# the one edit here that touches a build - and `run` notices the difference and
# refreshes the *boot files* alone rather than reinstalling the root filesystem.
# An image baked as `weston` has no marker this xtask reads, so the first `run`
# after this change takes that one refresh, and the refresh now genuinely rewrites
# the command line inside the image: `weston` baked `console=ttyS0`, which today's
# `gui` replaces with `console=tty0`.
qemu.mode = "gui"

# The first machine's own half, and it is empty: every value it reads is one of
# the baseline's, which is where those values were written from. When a value
# stops being shared it moves *here* rather than into `[default]`, where the
# second machine would start inheriting it - `user.name` in `rootfs.toml` is the
# shape of that mistake, and the reason its section exists at all.
[x86_64]

# The second machine's own half.
#
# What is *not* here is as deliberate as what is: the second machine's device
# transports (its `virtio-*-device` MMIO forms, its PL011, its `-machine virt`)
# are how that kernel finds its devices at all, not choices - a `virtio-gpu-pci`
# there would attach a card the machine cannot reach, because it discovers
# devices by walking its own device tree. Those stay in
# `xtask/src/qemu.rs::virt_machine_args`, next to the first machine's own
# list, with the reason on each line.
[aarch64]
# Empty, and it has to be: the key would otherwise inherit the baseline's
# `["-vga", "none"]`, an x86-only option that a `-machine virt` boot refuses
# outright. An empty list is a value; an absent key is not one.
qemu.extra_args = []
