# tests.toml - which user test programs the self-test sweep runs.
#
# `cargo xtask test` builds every program and boots the ones that are in **no
# group**. A test is left out of that default sweep by being named in a group
# here, and the reason is always the same shape: it needs something that is not
# the machine under test, or it measures instead of asserting, or it is not a
# check at all. What that buys is the only thing a gate is for - a red default
# sweep means the kernel, rather than the internet, the host's resolver, or a
# host that happened to be busy.
#
#   cargo xtask test                     # the ungrouped tests, plus `default`
#   cargo xtask test --groups slow       # the ungrouped tests, plus `slow`
#   cargo xtask test --all-groups        # everything, groups and all
#
# A group name the file does not define is an error rather than a quiet no-op,
# and so is a name here that no built program answers to: running fewer tests
# than the caller asked for is the one failure this must not have. A test may
# appear in more than one group, and then runs when any of them is asked for.
#
# One group is different in kind from the rest: a group **named after a machine**
# is that machine's list of what it cannot serve yet. Only that machine's sweep
# sees it, so its members are ungrouped - and in a plain sweep - everywhere else.
# An exclusion written that way can never take a test out of the other machine's
# gate. See `aarch64` at the bottom.
#
# The parser is the small one `rootfs.toml` uses: `key = value`, one array per
# key (which may be written across several lines), and section headers are for
# the reader. Group order in the output follows the name, not the line.

# Groups a plain `cargo xtask test` adds to the ungrouped tests. Empty - the
# shipped value - means "the ungrouped ones", which is what the sweep should be:
# everything that is a check of this machine and of nothing else.
default = []

# Needs something outside the machine: the host's network, through QEMU's
# user-mode stack, or a program listening on the host. A red one of these is a
# statement about the internet or the host's own services before it is a
# statement about the kernel - which is why the default sweep leaves them out,
# and why they are worth running on purpose.
#
#   t-dns, t-stdresolve  resolve real names through the host's resolver
#   t-udp                sends a DNS query to 10.0.2.3 and reads the answer
#   t-rawicmp            pings a public address (110.242.74.102) and compares
#                        what it reads against what the host's own ping gets.
#                        The comparison *is* the test, so the internet is one
#                        of its two halves: when the host cannot reach that
#                        address - filtered, rate-limited, or the path merely
#                        slow - what fails is not the machine under test. It
#                        blocked three of four sweep runs while this file
#                        listed it as a machine check, and the same kernel
#                        answered 3/3 from the run machine minutes earlier.
#   t-tcp-close          needs a listener on the host's 127.0.0.1:4599; with
#                        none it prints `skip:` and passes, so it is a probe
#                        and not a gate in either state
external = ["t-dns", "t-rawicmp", "t-stdresolve", "t-tcp-close", "t-udp"]

# Slow, or a measurement rather than an assertion. `t-fill-ramfs` writes up to
# 1024 MiB a chunk at a time; the other three are instruments whose numbers are
# the point and whose verdict can depend on how busy the host is (§10.2, §10.4
# carry their figures).
slow = ["t-fill-ramfs", "t-forkcost", "t-netlat", "t-pipecost"]

# Not a check at all. `t-sh` execs an interactive busybox ash onto the console
# and prints what it observes about where the shell stopped; it is here to be
# run by hand when a shell problem needs looking at.
diagnostic = ["t-sh"]

# The second machine's own list: what aarch64 cannot serve yet. A group named
# after a machine is invisible to the other machine's sweep, so every name here
# still runs in x86_64's default sweep exactly as it did before - what this group
# changes is the aarch64 arm, which leaves these out and prints them by name
# rather than reporting them as failures or skipping them silently. The way to
# shrink this group is to make the call work, not to edit a list of things nobody
# runs (`PLAN.md` §13.4/§13.5).
#
# The socket family used to be here - eleven names, every one of them stopping at
# `socket(2)` with ENOSYS because this machine had no stack. §13.4's flip gave it
# one (the MMIO adapter the boot's `check_net` opens and hands to `net::init`),
# and the whole family now runs: `t-socket`, `t-sockmsg`, `t-sockopt`, `t-tcp`,
# `t-tcp-listen`, `t-udp-loopback` and `t-unix-rustix` all pass on aarch64,
# including a TCP connect/accept/read-write round trip over the stack. What is
# left is one reason, and it is the harness's rather than the ABI's.
#
#   t-socketpair, t-stdspawn  their subject is *other programs*. `t-stdspawn`
#                             runs /bin/true, /bin/echo, /bin/cat, /bin/false and
#                             /bin/sh -c; `t-socketpair` runs /bin/cat. The
#                             x86_64 harness has those because its test root is
#                             an initramfs with busybox in /bin; the second
#                             machine's root is the ext4 disk rootfs and has no
#                             /bin at all. A gap in the harness, not in the
#                             kernel's spawn path - which every program in this
#                             payload exercises, since the runner starts each of
#                             them through posix_spawn (clone + execve).
aarch64 = ["t-socketpair", "t-stdspawn"]
