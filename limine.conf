default_entry: 1
timeout: 0
verbose: yes

# Boot flow:
#   1. UEFI loads Limine from the ESP (partition 1, FAT32)
#   2. Limine loads the kernel from the boot partition (partition 2, FAT32)
#   3. Limine loads the initramfs from the boot partition as a module
#   4. Kernel unpacks initramfs as temporary root
#   5. Kernel mounts rootfs (partition 3, ext2) as the real root
#   6. Kernel pivots to rootfs and unmounts initramfs
/mpos
    comment: mpos kernel
    protocol: limine
    kaslr: no
    path: boot(2):/boot/mpos.elf
    module_path: boot(2):/boot/initramfs.tar
