# machine.toml - the machine `run` and `test` boot the image on.
#
# This is the *host* half of the build: how QEMU is wired, and how much of the
# host's resources the guest is given. None of it is copied into the image, so
# editing it must never invalidate one - which is the whole reason it is not in
# `rootfs.toml`. That file's stamp is compared against the file's mtime, so
# anything written there costs a full reinstall of the Alpine tree (thirty-odd
# packages over the network) even when what changed was a memory size.
#
# The two files divide like this:
#
#   rootfs.toml   what the image *contains* - the packages, the files written
#                 into it, and its own disk geometry (`image_size`, `esp_size`:
#                 changing those re-makes the partitions and filesystems, so a
#                 rebuild is exactly what should happen).
#   machine.toml  what the image is *booted on* - the window, the memory, the
#                 devices QEMU attaches, and the standing run mode.
#
# Two keys cross that line, and both are read through rather than duplicated:
# `[system] hostname` in `rootfs.toml` is also the name QEMU's DHCP server is
# told (one machine has one name, so it lives where it is written into the
# image), and `[rootfs] serial_port` names the port the boot console and the
# getty share. Neither is a key of this file.
#
# A device this file turns off is a device the guest does without; a run
# overrides the memory for one boot with `MEM=`.

[qemu]
memory = "2048"
# Processors. One is QEMU's default; a second one is what exercises the kernel's
# bring-up of another processor, which is why the option is here.
cpus = 1
# Appended to the QEMU command line verbatim, after everything the build
# computes. One argument per element, and an element may not contain a comma -
# the list is comma-separated on the way in.
extra_args = []
# The virtio-vsock device (`-device virtio-vsock-pci,guest-cid=3`), for
# `socket(AF_VSOCK)` to the host: the guest's cid is 3, the host answers on
# cid 2. Off unless the host has the vhost kernel module it needs - QEMU
# refuses to start without it, and a boot that never starts is worse than a
# machine with no vsock. `ls /dev/vhost-vsock` is how you know.
vsock = true
# The virtio-sound card, with an audio backend that plays nowhere: the guest
# exercises the driver and /dev/dsp, the host hears silence. Needs QEMU 8.2
# or newer for the card to exist at all.
audio = true
# The GPU device QEMU attaches (`-device`). `virtio-gpu-pci` is the 2D scanout
# every boot has used, and it asks nothing of the host. `virtio-gpu-gl-pci` is
# the same device with the host's `virglrenderer` behind it - the one thing
# that makes a compositor refusing a *software* EGL device able to run at all
# (`PLAN.md` §7.4). A GL boot names the display backend's own GL suboption
# beside it (`display = "gtk,gl=on"`, or `egl-headless,gl=on` for a headless
# one); the *device* starts without it, because what needs the context is the
# guest's renderer and not the card.
#
# Named as QEMU names it rather than as a boolean, because this host has more
# than one GL device (`virtio-vga-gl` and a rutabaga/gfxstream variant sit
# beside the PCI GL card), and a host with a different one should be asked for
# it here rather than in the xtask's source.
gpu = "virtio-gpu-pci"
# The QEMU display backend for an interactive `run` (`-display`), so the
# framebuffer console has a window to show itself in. Absent means `sdl`; name
# another backend your QEMU was built with, or `none` to watch only the serial
# log - which then goes quiet once the console moves to the framebuffer. A
# `test` boot ignores this and always runs headless.
# display = "gtk"
# How `cargo xtask run` boots the machine, overridable per invocation with
# `--mode <mode>`. One word picks both the QEMU wiring and the consoles the guest
# is told to use, because the window and the guest's own console have to agree.
# There are three of them, because there are two questions to answer — is there a
# window, and is the framebuffer one of the guest's consoles — and every mode
# keeps the serial line, because a mode that dropped it dropped the kernel log
# with it; `gui` reads that line from a log file rather than the terminal:
#   terminal - serial only, no window. The guest is given `console=ttyS0`, so the
#              wire is its only console and the whole boot rides it losslessly;
#              the display device is still probed, and `/dev/fb0` still answers,
#              but nothing is drawn on it;
#   gui      - the whole machine in the window: a window with every device behind
#              it (GPU, keyboard, absolute tablet, DRM) and `console=tty0`, so the
#              boot log, the virtual consoles, the login prompt and the shells all
#              show *in the window*, and the host terminal shows nothing. The
#              guest never names the wire, so the kernel's console bytes go to the
#              screen alone; the launcher still taps the port, into
#              `build/serial.log`, because the UEFI loader's lines, the kernel
#              banner that precedes the command-line parse and a panic's forced
#              serial report reach no screen. A compositor is a guest of runtime,
#              not of this word: log in on the window's tty1 and run
#              `./start-weston.sh`, and the session claims the card, the kernel
#              text stops painting over it, and `^A 1`..`^A 6` — the kernel's own
#              mux, read from the window's keyboard — switches back to the console
#              and away again;
#   mirror   - `console=ttyS0 console=tty0`: the window takes the console over
#              once the framebuffer is up, and the wire keeps a best-effort copy
#              of the same text on the host terminal. Under a flood the serial
#              transcript may drop bytes while the window never stalls.
# Unset means mirror, which is what `run` did before the modes were split. A name
# this xtask does not have — including the retired `weston` and `compositor` — is
# an error at `run`, not a default: the two bake different `console=` lists, so a
# silent fallback would boot a machine nobody asked for. A `cargo xtask test` boot
# ignores this: its command line is its own, and it names the wire alone.
#
# This one key is also baked into the image (`mpos.cmdline`), so changing it is
# the one edit here that touches a build - and `run` notices the difference and
# refreshes the *boot files* alone rather than reinstalling the root filesystem.
# An image baked as `weston` has no marker this xtask reads, so the first `run`
# after this change takes that one refresh, and the refresh now genuinely rewrites
# the command line inside the image: `weston` baked `console=ttyS0`, which today's
# `gui` replaces with `console=tty0`.
mode = "gui"
