[package]
name = "mpos-xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache"] }

[lints]
workspace = true
