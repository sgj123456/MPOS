# The std-side user tests: ordinary Rust binaries that exercise the kernel
# through `std` and `rustix` - the same surface musl programs speak - for the
# calls whose behaviour is easiest to pin from a hosted language (sockets,
# name lookup, spawning). The `#![no_std]` conformance suite used to live
# beside this crate in `user/abitest` and moved here one program at a time,
# so this crate is now the whole suite and `cargo xtask test` builds one
# target for it.
#
# These are built for `x86_64-unknown-linux-musl` and statically linked,
# because this kernel's Linux ABI is written against musl and its loader only
# accepts the static ET_EXEC shape - see the rustflags in the root
# `.cargo/config.toml`.
#
# `rustix` rather than raw `syscall` instructions is not a style choice. A
# test written with inline asm can pass against a kernel that is wrong: the
# arguments are whatever the author wrote down, and the errno is whatever the
# register happened to hold. `rustix` names the call, checks the shape, and
# hands back a `Result` whose `Errno` is the one Linux defines - so a test
# that says "this is EAFNOSUPPORT" is a claim about the ABI, not about the
# author's memory of it.
#
# `libc` is here for the calls `rustix` cannot be *relied on* to bind, and the
# migration of the no-std suite has measured three shapes of that:
#
#   * a call it does not bind at all - `process_vm_readv`/`writev` and
#     `rt_sigtimedwait`, driven through `libc::syscall` with the number from
#     `libc::SYS_*`; and `faccessat2`, which `rustix` reaches only through
#     `accessat` *with* a flag word, so the no-flag spelling two programs pin
#     has no binding to call (`t-faccessat`, `t-faccessat2`);
#   * a call whose wrapper is not the syscall the ABI promises on every machine,
#     or throws away the result the ABI promises. Measured, not guessed:
#     `rustix::io::dup2` substitutes `dup3(fd, new, DupFlags::empty())` under
#     `cfg(target_arch = "aarch64")` - its own source says so, and for a good
#     reason, since `new` is `&mut OwnedFd` there and so `oldfd == newfd` is
#     unreachable through it. But that case is *the POSIX no-op this kernel
#     must answer with the descriptor*, and `dup3(fd, fd, 0)` is EINVAL, so a
#     test written against the wrapper would pin a different call on one
#     machine than the other. `t-dup2` calls `libc::dup2`. The same shape, one
#     step milder: `rustix::io::close` takes a raw fd and returns nothing, so
#     "close answers 0" cannot be expressed through it at all.
#   * a call whose wrapper binds the right syscall but whose *shape* cannot
#     express the claim. Measured: `rustix::io::dup3(fd, &mut OwnedFd, DupFlags)`
#     returns `()` rather than the new number, and takes its target as a
#     non-aliasing `&mut OwnedFd`, so `oldfd == newfd` - the one case where dup3
#     differs from dup2 - is unreachable through it. Those two are what send
#     `t-dup3` to `libc::dup3`, which takes and returns the raw numbers the
#     syscall does; the program's third claim (a flag word with bits beyond
#     `O_CLOEXEC`) rides along rather than forcing the choice. The same clause a
#     second time: `rustix::process::getcwd` takes a `Vec<u8>` and returns a
#     `CString`, growing it on ERANGE until the path fits - so the *size the
#     caller chose* (and its EINVAL and ERANGE answers) and the *address the
#     syscall returns* are both outside it, which is what `t-getcwd` and
#     `t-chdir` pin through `libc::getcwd`. The same clause a third time:
#     `rustix::fs::openat2` writes `size_of::<open_how>()` itself, so 23 and 25 -
#     the two halves of the version handshake that *are* `t-openat2`'s subject -
#     are unreachable through it.
#
# Two ways of "cannot express it" look alike and are not, and only the second is
# a reason to leave `rustix`. A rustix **bitflags** type carries bitflags'
# unnamed flag (`const _ = !0` - bitflags' "mask of all bits the external source
# may ever set"), and every bitflags type generates `from_bits_retain`. So an
# unnamed *bit* is expressible: `DupFlags::from_bits_retain(!0)` is a legal call
# that holds every bit, and a mode word from a kernel newer than this one has
# somewhere to go (`t-fallocate` puts one there). A claim about a bit is
# therefore *not* on its own a reason to reach for `libc`. A rustix **plain enum**
# (`SeekFrom`, `Advice`) has no such escape - the out-of-vocabulary word has
# nowhere to go at all - and that is a real reason: a bogus `whence`
# (`t-lseek`), an advice nothing names (`t-fadvise`), is what forces `libc`.
#
# Driving a call through `libc::syscall` does not mean spelling its numbers by
# hand: `t-faccessat2` takes `AT_EACCESS` from `rustix::fs::AtFlags` because
# `libc` 0.2.189 does not define it for linux-musl at all (measured - it is in
# the crate for fuchsia, the BSDs, Hurd and AIX, and in no `linux_like` file),
# and `t-openat2` takes its flags and mode from `rustix::fs` for the same
# reason. The number still comes from a maintained per-machine table.
#
# There is one more way to reach the raw call, and it is a measurement rather
# than a preference: a wrapper that is not a passthrough *for the argument the
# claim is about*. `t-fstat`'s null-buffer `EFAULT` claim is the case, and both
# wrappers fail it for different reasons - `rustix::fs::fstat` owns its buffer,
# so the caller's address is outside it, and musl's own `fstat`, handed a buffer
# the kernel would refuse, faults in userspace instead of answering: NULL and
# `0x1` both killed the process with SIGSEGV, run in child processes so that one
# crash could not hide the next, while the raw call answered `EFAULT` for both
# and 0 for the caller's own buffer (`size_of::<libc::stat>()` is 144, so the
# declared type is the right one). That claim is `libc::syscall(libc::SYS_fstat,
# ..)`, with the number still from `libc`'s per-machine table - 5 on the first
# machine and 80 on the second.
#
# All of them keep the purpose of the rule above: the number, the call and its shape
# come from a maintained per-machine table rather than from this repository's
# memory of them. It is still not a second interface for calls `rustix` names
# *and* answers the way the ABI says.
[package]
name = "mpos-user-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "all-apis",
] }
libc = "0.2"

# The binaries are named `t-<syscall>`, one per syscall family, so the test
# run's output says which one is missing.
[lints]
workspace = true

