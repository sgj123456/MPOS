# The std-side user tests: ordinary Rust binaries that exercise the kernel
# through `std` and `rustix` - the same surface musl programs speak - for the
# calls whose behaviour is easiest to pin from a hosted language (sockets,
# name lookup, spawning). The no-std ABI conformance suite lives beside this
# crate in `user/abitest`; `cargo xtask test` runs both.
#
# These are built for `x86_64-unknown-linux-musl` and statically linked,
# because this kernel's Linux ABI is written against musl and its loader only
# accepts the static ET_EXEC shape - see the rustflags in the root
# `.cargo/config.toml`.
#
# `rustix` rather than raw `syscall` instructions is not a style choice. A
# test written with inline asm can pass against a kernel that is wrong: the
# arguments are whatever the author wrote down, and the errno is whatever the
# register happened to hold. `rustix` names the call, checks the shape, and
# hands back a `Result` whose `Errno` is the one Linux defines - so a test
# that says "this is EAFNOSUPPORT" is a claim about the ABI, not about the
# author's memory of it.
#
# `libc` is here for the calls `rustix` cannot be *relied on* to bind, and the
# migration of the no-std suite has measured three shapes of that:
#
#   * a call it does not bind at all - `process_vm_readv`/`writev` and
#     `rt_sigtimedwait`, driven through `libc::syscall` with the number from
#     `libc::SYS_*`;
#   * a call whose wrapper is not the syscall the ABI promises on every machine,
#     or throws away the result the ABI promises. Measured, not guessed:
#     `rustix::io::dup2` substitutes `dup3(fd, new, DupFlags::empty())` under
#     `cfg(target_arch = "aarch64")` - its own source says so, and for a good
#     reason, since `new` is `&mut OwnedFd` there and so `oldfd == newfd` is
#     unreachable through it. But that case is *the POSIX no-op this kernel
#     must answer with the descriptor*, and `dup3(fd, fd, 0)` is EINVAL, so a
#     test written against the wrapper would pin a different call on one
#     machine than the other. `t-dup2` calls `libc::dup2`. The same shape, one
#     step milder: `rustix::io::close` takes a raw fd and returns nothing, so
#     "close answers 0" cannot be expressed through it at all.
#   * a call whose wrapper binds the right syscall but whose *shape* cannot
#     express the claim. Measured: `rustix::io::dup3(fd, &mut OwnedFd, DupFlags)`
#     returns `()` rather than the new number, takes its target as a
#     non-aliasing `&mut OwnedFd` (so `oldfd == newfd` is unreachable through
#     it), and takes its flags as a typed bitset that cannot hold an invalid
#     word - which is all three of the things `t-dup3` pins. `libc::dup3` takes
#     and returns the raw numbers and the raw flag word the syscall does. The
#     same clause a second time: `rustix::process::getcwd` takes a `Vec<u8>` and
#     returns a `CString`, growing it on ERANGE until the path fits - so the
#     *size the caller chose* (and its EINVAL and ERANGE answers) and the
#     *address the syscall returns* are both outside it, which is what
#     `t-getcwd` and `t-chdir` pin through `libc::getcwd`.
#
# All three keep the purpose of the rule above: the number, the call and its shape
# come from a maintained per-machine table rather than from this repository's
# memory of them. It is still not a second interface for calls `rustix` names
# *and* answers the way the ABI says.
[package]
name = "mpos-user-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "all-apis",
] }
libc = "0.2"

# The binaries are named `t-<syscall>`, one per syscall family, so the test
# run's output says which one is missing.
[lints]
workspace = true

