# The ordinary user programs that run on mpos - `std` binaries, `fn main`,
# with `rustix` for the calls that are not in `std`. They are built for
# `x86_64-unknown-linux-musl` and statically linked, because this kernel's
# Linux ABI is written against musl and its loader only accepts the static
# ET_EXEC shape - see the rustflags in the root `.cargo/config.toml`.
#
# The test programs are deliberately *not* here: the no-std ABI conformance
# suite lives in `user/abitest`, the std-side tests in `user/tests`, and
# `cargo xtask test` is what builds and runs them. A regular program ships in
# the system image; a test only ever ships in the self-test initramfs.
[package]
name = "mpos-user"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "all-apis",
] }
