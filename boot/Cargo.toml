[package]
name = "mpos-boot"
version = "0.1.0"
edition = "2024"

# The loader is a UEFI application, so it is built for the `x86_64-unknown-uefi`
# target rather than the kernel's `x86_64-unknown-none` - they are different
# machines as far as rustc is concerned, with different object formats (PE
# against ELF) and different calling conventions at the firmware boundary. The
# workspace root pins the kernel's target; `boot/.cargo/config.toml` pins this
# one, so `cargo build` inside this directory does the right thing on its own.
#
# `alloc` is what `FileSystem::read` needs to hand back a `Vec<u8>`, and with it
# comes `global_allocator`: the firmware's pool allocator is the only one there
# is before boot services are exited, so `uefi` installs it as the crate's own.
# Neither survives `exit_boot_services`, which is why every allocation this
# loader makes happens before that call - see the ordering note in `main.rs`.
[dependencies]
# The boot record itself, as the leaf the kernel also reads it through. It was
# duplicated here field-for-field until this dependency existed, kept in step by
# a magic number and a comment; now the loader and the kernel name one
# definition, and the record cannot drift out of step with itself. The leaf is
# `#![no_std]` plain data with no dependencies, so it compiles for the firmware
# target as readily as for the kernel's.
mpos-bootinfo = { path = "../crates/bootinfo" }
# The ACPI table reader, as the leaf the kernel also reads tables through. The
# loader's half is one question - which address the firmware's root pointer is
# at - and validating the pointer before handing it on; the walk belongs to the
# kernel, which is the side that lives long enough to want the tables.
mpos-acpi = { path = "../crates/acpi" }
# The machine layer, for the three things this loader needs from the machine:
# the page-table descriptor format, the progress wire, and the last instruction
# (`mpos_arch::early`). The dependency is what makes "this loader names no
# architecture" a fact cargo enforces rather than a convention - the crate it
# depends on is the one that holds the machines, and there is nothing else in
# the graph that does (`NOTES.md` §14.6).
mpos-arch = { path = "../arch" }
uefi = { version = "0.36", default-features = false, features = [
    "alloc",
    "global_allocator",
] }

[[bin]]
name = "mpos-boot"
path = "src/main.rs"

# The loader's body, as a library. `src/main.rs` is the `#[entry]` that calls
# it; the kernel, once it becomes the UEFI application itself (`NOTES.md` §14.7),
# will be the second caller. Naming it here rather than letting cargo infer it
# keeps the two halves of one crate symmetric on the page.
[lib]
name = "mpos_boot"
path = "src/lib.rs"

[lints]
workspace = true
