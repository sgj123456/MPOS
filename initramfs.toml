# initramfs configuration for mpos
# This file specifies additional packages to install in the initramfs

[initramfs]
# Alpine mirror URL
mirror = "https://mirrors.tuna.tsinghua.edu.cn/alpine"
# Alpine branch
branch = "latest-stable"
# Architecture
arch = "x86_64"

# Base packages that are always installed (do not modify unless needed)
base_packages = ["busybox", "alpine-baselayout", "apk-tools"]

# Additional packages to install in initramfs
# These are added on top of the base packages
extra_packages = []

# Files to include in the initramfs (relative to initramfs/ directory)
# These will be copied to the root of the initramfs
include_files = []

# Directories to include in the initramfs (relative to initramfs/ directory)
# These will be copied recursively to the root of the initramfs
include_dirs = []
