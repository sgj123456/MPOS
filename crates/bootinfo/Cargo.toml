# The boot record and the kernel's view of it, as a leaf.
#
# Its own crate because a machine layer that is becoming `mpos-arch` names both
# of them - `Paging::install` takes a `BootInfo`, the aarch64 entry takes a
# `Handoff` - and so does every layer above it. Neither side can own a type the
# other has to spell, so the pair lives below both (`PLAN.md` §14 S2a).
#
# No dependencies: the record is `#[repr(C)]` integers and `BootInfo` is plain
# data, so there is nothing here for a crate to depend on and nothing for a host
# test to stub.
[package]
name = "mpos-bootinfo"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints]
workspace = true
