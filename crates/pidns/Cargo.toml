# The PID namespace: the numbers a task is known by from inside a namespace.
#
# Pure bookkeeping over two maps and a counter, so it is its own leaf crate: the
# allocation rule, the parent chain and the two-way lookup are the whole
# mechanism, and a leaf cannot name the kernel, which is what keeps this from
# growing a dependency on the task table it numbers. `crates/uts` is the
# template - the object a task holds behind an `Arc`, the number given in from
# the one pool `src/vfs/ns.rs` mints, and the shared-state lock gated exactly as
# the kernel gates it.
[package]
name = "mpos-pidns"
version = "0.1.0"
edition = "2024"

[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
critical-section = { version = "1.2", features = ["restore-state-bool"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1.2", features = ["std"] }

[lints]
workspace = true
