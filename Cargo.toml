# One workspace for the whole system: the kernel and every program that runs
# on it. The kernel stays the root package, so the plain `cargo build`,
# `cargo test` and `cargo clippy` the scripts have always run keep meaning
# "the kernel" - `default-members` says so explicitly, because a workspace
# without it would build the user programs for the host too, and they are
# built for musl.
[workspace]
members = ["arch", "user", "user/tests", "boot", "xtask", "crates/*"]
# "." is the kernel - the root package, which is a member without being
# listed in `members`.
default-members = ["."]

[package]
name = "mpos"
version = "0.1.0"
edition = "2024"

# The kernel's one build-time switch, and it is the test build: with `selftest`
# off - every ordinary build, and the only shape that ships - the wiring layer
# compiles neither the boot's check families nor the harness that runs them, so
# "does the production kernel contain test code" is answered by the compiler
# rather than by a reviewer.
#
# A cargo feature rather than a `--cfg`: the `mpos_*` words in
# `.cargo/config.toml` are *machine* facts and belong unconditionally in their
# target's block, while this is a fact about the *build*. Adding a `--cfg` there
# is not possible - setting `RUSTFLAGS` **replaces** that block rather than
# extending it, taking the linker script and all nine capability flags with it
# (measured: four errors in `mpos-arch`) - so the additive form of the switch is
# the only one that works, and it is also the shape of the thing it imitates
# (`CONFIG_KUNIT=y`). `docs/NOTES.md` §15.19.
[features]
selftest = []

# Machine-dependent crates are gated behind `target_os = "none"`. That keeps the
# host build (cargo test --lib --target x86_64-unknown-linux-gnu) free of
# bootloader, port-I/O and locking crates, and makes the arch-agnostic core of the
# kernel - the frame allocator, the mapping plan, later the VFS and the
# scheduler's policy code - testable with plain `cargo test`.
[dependencies]
# The errno table, its own leaf crate (see `crates/err` and `ARCHITECTURE.md` §9
# V-14). Re-exported by `src/lib.rs` as `crate::err`, so every caller's path is
# unchanged; the crate itself cannot name the kernel.
mpos-err = { path = "crates/err" }
# The ACPI table reader (`crates/acpi`): the root pointer, the RSDT/XSDT walk and
# MCFG's memory-mapped configuration windows. Re-exported below as
# `crate::acpi`, and used by `drivers::pci` to find the window this machine
# enumerates configuration space over.
mpos-acpi = { path = "crates/acpi" }
# The boot record (`Handoff`) and the kernel's view of it (`BootInfo`), as a
# leaf: the machine layer names both - `hal::Paging::install` takes a `BootInfo`
# and the aarch64 entry is handed a `Handoff` - so neither the kernel nor the
# machine crate can own them (`NOTES.md` §14 S2a). `src/boot` re-exports them
# under their old names.
mpos-bootinfo = { path = "crates/bootinfo" }
# The mapping vocabulary the same way: `Mapping`, `MapFlags`, `PageTaken`,
# `KernelSections`, the page arithmetic and the machine-independent
# `kernel_mappings` plan, all of which `hal::Paging` is written in
# (`NOTES.md` §14 S2b). `src/mm/vm.rs` and `src/mm/pframe.rs` re-export them.
mpos-vm = { path = "crates/vm" }
# The arch-neutral Linux ABI facts (`clone` flags, default umask, the rlimit
# model) as a leaf, so `sched` names them without an edge up into `syscall`'s
# dispatch. `syscall`'s `nr`/`abi` re-export these rather than redefining them.
mpos-abi = { path = "crates/abi" }
# The other pure leaves of the same kind (see `crates/*` and `ARCHITECTURE.md`):
# each is a downward-only leaf, re-exported by `src/lib.rs` under its old name
# so every `crate::X` caller is unchanged.
mpos-date = { path = "crates/date" }
mpos-binfmt = { path = "crates/binfmt" }
mpos-cred = { path = "crates/cred" }
mpos-uts = { path = "crates/uts" }
mpos-pidns = { path = "crates/pidns" }
mpos-timens = { path = "crates/timens" }
mpos-userns = { path = "crates/userns" }
mpos-seccomp = { path = "crates/seccomp" }
mpos-pci = { path = "crates/pci" }
# The block layer seam: the `BlockDev` trait a filesystem reads its storage
# through, the registry that names every disk, and the GPT/MBR decode that finds
# a filesystem on one. A pure leaf - the trait is a contract and the parser is
# arithmetic, both host-tested - and the crate boundary is what keeps it from
# naming the kernel it serves.
mpos-blk = { path = "crates/blk" }
# Two more leaves of the same kind, extracted after the seven above: the terminal
# emulator (a cell grid is not a filesystem fact, NOTES.md §11.1.4) and the AHCI
# port decode (arithmetic on three `u32`s whose only reader is machine-only).
mpos-term = { path = "crates/term" }
mpos-ahci = { path = "crates/ahci" }
# The GPU's pure half (the wire ABI, the DRM blobs, the cursor blend, the
# sync-object state machine). Its own crate, and the one edge that kept it out of
# one - the wake a parked sync-object waiter needs - is an injected trait now.
mpos-gpu = { path = "crates/gpu" }
# The input policy pair: which evdev reader sees which event (and the request
# vocabulary a program declares a uinput device with). Both were host-compiled
# inside `src/` already; as crates they cannot name the scheduler or a driver,
# which is what their waiter numbers used to require.
mpos-evdev = { path = "crates/evdev" }
mpos-uinput = { path = "crates/uinput" }
# The device tree reader: the second machine's description of itself, read as
# bytes. Pure - a blob in, names and numbers out - so the part that can be wrong
# in a way only a boot would show is the part a host test can pin. Stage 5's
# first piece; see `NOTES.md` §9.1.
mpos-fdt = { path = "crates/fdt" }
# The link layer's wire format: `AF_PACKET`'s `sockaddr_ll`, the Ethernet header
# and the packet socket's frame ring. Extracted from `src/net/packet.rs`, which
# is welded to the NIC seam and so machine-only - the three parsers had no host
# test and no fuzz target while they sat behind `net`'s `target_os = "none"`
# gate (`docs/notes/` §4.5, `docs/uapi/` §5.4).
mpos-link = { path = "crates/link" }

# Used by the arch-agnostic mapping plan, so deliberately not target-gated.
# Already in the tree as a dependency of `x86_64`.
bitflags = "2.13"

# The ELF loader parses user images with the same crate on the host (for the
# unit tests) and in the kernel, so this is also not target-gated.
elf = { version = "0.8", default-features = false, features = ["alloc"] }
virtio-drivers = "0.13"

# The kernel's random source: a ChaCha20 stream, which `/dev/urandom` and
# `getrandom(2)` both draw from. The pure-Rust implementation is used rather
# than a hand-written cipher - this is the one place in the kernel where being
# subtly wrong is invisible until it is a security bug. `no_std` at the default
# feature set, and `rand_core` supplies the `SeedableRng`/`RngCore` traits.
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }

# Kernel logging. `tracing` is used in its `no_std` configuration - the
# subscriber crates all need `std` - and the subscriber that turns an event
# into a line on the serial console is this crate's own (`src/logging.rs`).
# The macro front end is why it is `tracing` and not a hand-rolled `log!`:
# an event carries a level, a target and structured fields, and the console
# gets all three without a formatting layer of the kernel's own. `alloc` is
# required by `tracing-core` when `std` is off, and the kernel has an
# allocator before the first event is emitted.
tracing = { version = "0.1", default-features = false }

# Host-test-only: the kernel's `/sys` and `/proc` tests build fake PCI devices
# and take the pci device-list lock across the crate boundary. A dev-dependency
# unifies `test-helpers` onto mpos-pci for test builds only; a production
# `cargo build` prunes dev-dependencies, so the fixtures stay cfg'd out of the
# shipped kernel (edition-2024 resolver v3 keeps the two graphs separate).
[dev-dependencies]
mpos-pci = { path = "crates/pci", features = ["test-helpers"] }

# Both bare-metal machines: the interrupt-masking critical section every layer
# below the scheduler locks with. Each `arch/<arch>/critical.rs` supplies the
# implementation - `cli`/`sti` on x86_64, the `DAIF` mask on aarch64 - so the
# dependency itself is shared even though the machine body is not.
[target.'cfg(target_os = "none")'.dependencies]
critical-section = { version = "1.2", features = ["restore-state-bool"] }

# The machine layer, as a crate of its own: the HAL (`mpos_arch::hal`) and the
# two ports (`mpos_arch::arch::{x86_64,aarch64}`). `src/lib.rs` re-exports both
# under the names they already had, so no call site or its commentary moved -
# but the boundary is a crate boundary now, which is what makes the machine
# layer's independence cargo's business rather than a convention's
# (`NOTES.md` §14 S4). Machine-only: it is `cli`/`sti`, MSRs and descriptor
# tables, so the host build does not compile it and this block is where that is
# said.
mpos-arch = { path = "arch" }

# The host test build compiles the VFS too, which locks; `std` picks the stock
# critical section for hosted targets.
[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1.2", features = ["std"] }

# x86_64-only: mpos-boot is the x86_64 UEFI loader, the 16550 driver talks to
# port I/O, and the IDT's one-time init is the only spin::Once user. The network
# stack is here rather than in the shared block because `net` is x86_64's: it
# rides a virtio-PCI device found through the legacy I/O-port config mechanism.
[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
uart_16550 = "0.8"
spin = { version = "0.12", default-features = false, features = ["once", "lazy"] }
x86_64 = { version = "0.15", default-features = false, features = [
    "instructions",
    "abi_x86_interrupt",
] }
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "socket-raw",
    "auto-icmp-echo-reply",
] }

# aarch64-only. The console is PL011 driven through `volatile` reads (no crate)
# and the boot stack is the linker script's, but the network stack is the same
# smoltcp integration the x86_64 machine runs: what differs under it is the wire
# (MMIO rather than PCI), not the stack. This is the home this block was left for
# when it was empty.
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "socket-raw",
    "auto-icmp-echo-reply",
] }

[profile.dev]
panic = "abort"
debug = 2

[profile.release]
panic = "abort"
lto = "thin"
# The user programs are built release even for a debug image, and a musl
# binary carrying debug info runs to ~9 MB - four of which do not fit in the
# ESP. Stripping costs nothing here: a conformance test either prints its
# verdict or it does not, and nobody debugs it through a symbol table.
strip = true

# The capability flags `crate::hal` gates its optional forwards on
# (`arch/src/hal/mod.rs`). Each machine declares the set it has in its own
# `[target.…]` block in `.cargo/config.toml`, so `hal` names no architecture -
# it asks whether the build has a capability. Declaring them here is what keeps
# `--cfg mpos_…` from tripping the `unexpected_cfgs` lint, and it is the one
# place the full vocabulary is listed.
#
# A workspace table rather than a package one because two packages speak it: the
# kernel and `mpos-arch`, the machine layer it now lives beside. A cargo lint
# table is per-package, so the list written twice is a list whose stale copy is
# the one that stops warning; `[lints] workspace = true` in each package is the
# opt-in. The other members declare no such flags and do not opt in.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(mpos_msi)",
    "cfg(mpos_serial_ring)",
    "cfg(mpos_fpu_trap)",
    "cfg(mpos_signal_frame)",
    "cfg(mpos_framebuffer_console)",
    "cfg(mpos_qemu_debug_exit)",
    "cfg(mpos_net)",
    "cfg(mpos_console_input)",
    "cfg(mpos_pci_config)",
    "cfg(mpos_input_registry)",
] }

[lints]
workspace = true
